apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm-gateway
resources:
  - ../../base
patches:
  - path: deployment-patch.json
    target:
      kind: Deployment
      name: gateway
  - path: account-patch.json
configMapGenerator:
  - name: model-downloader
    files:
      - download-model.py
